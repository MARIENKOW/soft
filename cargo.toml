[package]
name = "p2c_snatcher"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
tokio-tungstenite = "0.21"
tungstenite = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls"] }
futures-util = "0.3"
dotenv = "0.15"
