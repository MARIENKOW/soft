[package]
name = "p2p_snatcher"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tungstenite = "0.20.0"
tokio-tungstenite = "0.20.0"
reqwest = { version = "0.11.0", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15.0"
url = "2.4.0"
futures = "0.3.0"
stdweb = "0.4.20"
stdweb-internal-runtime = "0.2.2"
stdweb-derive = "0.5.3"
chrono = "0.4.0"
once_cell = "1.18.0"
log = "0.4.0"
env_logger = "0.10.0"