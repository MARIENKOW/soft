[package]
name = "p2c_snatcher"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full", "rt-multi-thread", "time", "net"] }
tokio-tungstenite = { version = "0.20.0", features = ["native-tls"] }
reqwest = { version = "0.11.0", features = ["json", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15.0"
url = "2.4.0"
log = "0.4.0"
env_logger = "0.10.0"
ctrlc = "3.4.0"
futures = "0.3.0"